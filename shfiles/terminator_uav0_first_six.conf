[global_config]
  suppress_multiple_term_dialog = True
[keybindings]
[profiles]
  [[default]]
[layouts]
  [[uav0_first_six]]
    [[[window0]]]
      type = Window
      parent = ""
      title = UAV0 前七步
      size = 1920,1080
      maximised = True
    [[[root]]]
      type = VPaned
      parent = window0
      ratio = 0.5
    [[[top]]]
      type = HPaned
      parent = root
      ratio = 0.333
    [[[step1]]]
      type = Terminal
      parent = top
      profile = default
      title = 1 MAVROS
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane mavros
    [[[top_right]]]
      type = HPaned
      parent = top
      ratio = 0.5
    [[[step2]]]
      type = Terminal
      parent = top_right
      profile = default
      title = 2 MID360
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane mid360
    [[[step3]]]
      type = Terminal
      parent = top_right
      profile = default
      title = 3 FAST-LIO
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane fastlio
    [[[bottom]]]
      type = HPaned
      parent = root
      ratio = 0.25
    [[[step4]]]
      type = Terminal
      parent = bottom
      profile = default
      title = 4 视觉位姿
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane pose
    [[[bottom_right]]]
      type = HPaned
      parent = bottom
      ratio = 0.333
    [[[step5]]]
      type = Terminal
      parent = bottom_right
      profile = default
      title = 5 检测上报
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane detection
    [[[bottom_far_right]]]
      type = HPaned
      parent = bottom_right
      ratio = 0.5
    [[[step6]]]
      type = Terminal
      parent = bottom_far_right
      profile = default
      title = 6 FUEL规划器RViz
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane planner
    [[[step7]]]
      type = Terminal
      parent = bottom_far_right
      profile = default
      title = 7 简单控制器
      command = __UAV0_FIRST_SIX_SCRIPT__ --pane controller
[plugins]
