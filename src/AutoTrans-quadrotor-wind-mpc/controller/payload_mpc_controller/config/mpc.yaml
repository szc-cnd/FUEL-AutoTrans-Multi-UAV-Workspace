# 普通四旋翼 + PX4/MAVROS 实机链路应设为 false：
# NMPC 内部推力 T 的单位是 N，发布到 MAVROS AttitudeTarget.thrust 前会转为归一化推力。
use_simulation: false
use_fix_yaw: false   # 是否固定偏航角。

# 状态代价
# 室内低速首轮保守权重：降低位置/速度追赶强度，提高横滚俯仰动作代价。
Q_pos_xy:   200.0    # 增强水平位置跟踪，同时仍低于原 250 的激进配置。
Q_pos_z:  200.0    # 垂直位置误差代价。
Q_attitude_rp:  120.0   # 横滚和俯仰姿态误差代价。
Q_attitude_yaw:  120.0    # 偏航姿态误差代价。
Q_velocity:  35.0   # 降低速度参考变化引起的姿态冲击。

# 以下 payload/cable 权重仅为兼容旧参数读取保留；普通四旋翼 NMPC 的 10 维状态不使用这些项。
Q_payload_xy:  20.0
Q_payload_z: 20.0
Q_payload_velocity: 3.0
Q_cable: 0.0
Q_dcable: 0.0

# 输入代价
R_thrust:    1.2  # 推力输入代价。
R_pitchroll:  20.0   # 提高横滚/俯仰角速度动作代价。
R_yaw:        1.2      # 偏航角速度输入代价。
# 速度越过正常上限时使用非负松弛量；高权重使越界只作为保持求解可行的短时退让。
R_velocity_slack_xy: 5000.0
R_velocity_slack_z: 5000.0

# 指数缩放：W_i = W * exp(-i/N * cost_scaling)。
# cost_scaling = 0 表示不缩放，此时 W_i = W。
state_cost_exponential: 0.5     # 状态代价指数缩放系数。
input_cost_exponential: 0.5     # 输入代价指数缩放系数。

# 输入限制
# body_rate.x/y 是发给 MAVROS/PX4 的机体系角速度命令，单位 rad/s。
max_bodyrate_xy:    1.5       # 室内低速飞行限制横滚/俯仰角速度冲击 [rad/s]
# body_rate.z 是机体系偏航角速度命令，单位 rad/s。
max_bodyrate_z:     0.5         # 连续轨迹偏航的最大角速度 [rad/s]
# min/max_thrust 是 NMPC 内部物理总推力限幅，单位 N，不是 MAVROS 归一化推力。
# 对 1.817 kg、g=9.795、hover_percentage=0.54，29.5 N 标称约对应归一化推力 0.895。
min_thrust:         1.0
max_thrust:         29.5
# NMPC 世界系正常速度软约束，单位 m/s；x/y 分量使用同一上限，z 单独限制。
max_velocity_xy: 1.5
max_velocity_z: 1.0
# 松弛量硬上限形成紧急速度边界：|vx/vy| <= 3.0 m/s，|vz| <= 2.0 m/s。
max_velocity_slack_xy: 1.5
max_velocity_slack_z: 1.0

# 是否使用轨迹终点位置以改善末端跟踪性能。
use_trajectory_ending_pos: true

# 是否在终端打印包括计算耗时在内的诊断信息。
print_info:   false

# AutoTrans 主控制循环的设定频率，单位 Hz；决定状态机处理、NMPC 求解和 MAVROS 控制指令更新的目标频率。
# 实际执行频率可能受 NMPC 计算耗时和 ROS 回调调度影响而低于该值。
ctrl_freq_max: 100.0

# 实机实验使用的控制状态机参数
max_manual_vel: 1.0
# AUTO_HOVER 中是否允许 CH1~CH4 按 max_manual_vel 积分移动悬停参考点。
# 注意 CH3 在这里表示高度参考速度，不是电机油门；非回中油门杆应保持 false。
enable_rc_hover_adjust: false

# AUTO_HOVER 和直接进入的 CMD_CTRL/HOVER 使用的固定位置参考。
# x/y/z 是 /mavros/local_position/odom 对应的 ENU 世界坐标，单位 m；yaw 仍取切入时当前航向。
# 关闭后恢复为“切换瞬间当前位置悬停”。固定模式下会忽略 enable_rc_hover_adjust。
fixed_hover:
    enabled: false
    x: 0.0
    y: 0.0
    z: 0.6

# 当前仅读取该参数，尚未接入控制状态机；数值单位为度，负值表示不限制。
max_angle: 30
# 当前版本未接入低电压自动保护；-0.1 表示禁用。实飞前应按电池节数和最低安全电压设置。
low_voltage: -0.1 # 四芯电池

filter:
    # /mavros/imu/data 实测为 200 Hz；加速度单位 m/s^2、角速度单位 rad/s，均为机体系数据。
    # sample_freq_* 仅用于按真实输入频率计算低通滤波器系数，不是 NMPC 或外力估计器执行频率。
    sample_freq_quad_acc: 200.0
    sample_freq_quad_omg: 200.0
    # 旧负载 IMU 参数仅为兼容旧参数读取保留；普通四旋翼控制路径不订阅 load_imu。
    sample_freq_load_acc: 400.0
    sample_freq_load_omg: 400.0
    # /mavros/esc_status 实测消息与有效 RPM 更新频率均接近 200 Hz。
    sample_freq_rpm: 200.0
    # 旧电缆参数仅为兼容旧参数读取保留；普通四旋翼控制路径不订阅 cable_info。
    sample_freq_cable: 400.0
    sample_freq_dcable: 400.0

    cutoff_freq_quad_acc: 20.0
    # 截止频率必须满足 0 < cutoff_freq < sample_freq / 2；0 或非法值会禁用滤波器。
    cutoff_freq_quad_omg: 20.0
    cutoff_freq_load_acc: 20.0
    cutoff_freq_load_omg: 20.0
    cutoff_freq_rpm: 20.0
    cutoff_freq_cable: 20.0
    cutoff_freq_dcable: 20.0

force_estimator: # *
    # kf 将 CAV1 四个电机的机械转速平方和换算为总推力，单位 N/rpm^2；
    # 由 1.836 kg 实机稳定悬停日志反算，用于世界系外力估计和推力模型模式 1 的 RPM 推力反馈。
    kf: 1.752e-8

    # f_Q 由外力观察器以 100 Hz 更新；该频率用于最终 f_Q 二阶低通滤波器系数。
    sample_freq_fq: 100.0
    sample_freq_fl: 400.0
    # 当前使用 3 Hz 低通，以降低 IMU/RPM 噪声，但会增加估计延迟。
    cutoff_freq_fq: 3.0  # 世界系外力估计 f_Q 的低通截止频率，单位 Hz；降低 IMU/RPM 噪声，但会增加估计延迟
    cutoff_freq_fl: 0.0
    imu_body_length: 0.66844507
    # 运行并记录世界系三轴外力估计 f_Q；是否写入 NMPC 由补偿总开关和三轴增益共同决定。
    enable_force_estimation: true
    enable_disturbance_compensation: true
    # 实际写入 NMPC 的世界系三轴补偿增益；当前启用 XYZ 三轴补偿。
    force_axis_gain_x: 1.0
    force_axis_gain_y: 1.0
    force_axis_gain_z: 1.0
    # 仅在 AUTO_HOVER/CMD_CTRL 中，PX4 连续确认 IN_AIR 达到该时间后才允许 f_Q 进入 NMPC，单位 s。
    compensation_airborne_delay: 0.8
    # 四路电机用于外力估计和补偿的最低有效机械转速，单位 rpm。
    min_valid_rpm: 1000.0
    # 外力估计结果的世界系三维模长上限，单位 N；超过该值的估计结果会被截断。
    max_force: 5.0
    # 实际写入 NMPC OnlineData 的世界系三维补偿力模长上限，单位 N。
    # 当前按实机试验选择设为 5 N；必须满足 max_applied_force <= max_force。
    max_applied_force: 5.0
    # 外力观察器每 10 ms 加入一组最新 IMU/姿态/RPM 样本并更新 f_Q，即 100 Hz。
    # max_queue/force_observer_freq 决定滑动窗口时长：20/100 = 0.2 s。
    max_queue: 20
    force_observer_freq: 100.0
    # 窗口内外力估计的平滑正则权重；源码值先保留。
    var_weight: 80.0

rc_reverse: # *
    roll: false
    pitch: true
    yaw: false
    throttle: true

rc_mode:
    # IPC 风格遥控器模式通道。这里使用 mavros_msgs/RCIn.channels 的数组下标：
    # mode_channel: 7 对应遥控器 CH8，land_channel: 9 对应遥控器 CH10。
    mode_channel: 7
    land_channel: 9
    # CH8 低位->AUTO_TAKEOFF，中位->AUTO_HOVER，高位->CMD_CTRL；阈值单位为 PWM/us。
    # CH6 不由 AutoTrans 读取，仅由 PX4/QGC 的 RC_MAP_OFFB_SW 负责切换 OFFBOARD。
    low_threshold: 1300
    mid_low_threshold: 1300
    mid_high_threshold: 1700
    high_threshold: 1800

takeoff:
    # AUTO_TAKEOFF 不自动解锁，也不调用 /mavros/set_mode；仅等待 PX4 已进入 OFFBOARD。
    enabled: true
    # 唯一 ENU 世界系起飞/悬停目标点的高度，单位 m；参考值按 climb_rate 平滑上升。
    target_z: 0.6
    # z 参考值上升速度，单位 m/s；达到 target_z 后保持目标点。
    climb_rate: 0.15
    # fixed_hover 启用时，起飞前到唯一目标点的水平距离上限，单位 m。
    max_initial_xy_error: 0.5

land:
    # AutoTrans 内部 AUTO_LAND 下降速度，单位 m/s；只降低世界系 z 方向悬停目标。
    descent_rate: 0.20
    # 内部下降目标的最低高度，单位 m。
    min_target_z: 0.05
    # odom 世界系 z 高度低于该值后，允许请求 PX4 AUTO.LAND，单位 m。
    switch_odom_z: 0.25
    # AUTO_LAND 持续超过该时间后也会请求 PX4 AUTO.LAND，单位 s；小于等于 0 表示不启用超时。
    timeout: 8.0

safety:
    # NMPC 首次失败后，在锁存位置尝试恢复求解的告警阈值，单位 s；超时继续重试，不自动降落。
    mpc_recovery_timeout: 1.0
    # 实际位置、速度和倾角同时收敛且 NMPC 连续成功该次数后，请求 Diff 从最新里程计重新规划。
    mpc_recovery_success_cycles: 5
    # 仅在当前姿态、速度和缓存角速度均安全时，短暂复用最后有效 MPC 输入，单位 s。
    mpc_recovery_last_valid_hold: 0.05
    mpc_recovery_last_valid_max_bodyrate: 0.25
    # 连续求解失败时，基于最新可信状态完整重置 ACADO 工作区的周期，单位 s。
    mpc_recovery_full_reset_period: 0.20
    # 重置时临时提高速度软约束阈值的余量，单位 m/s；速度回到正常范围后恢复原阈值。
    mpc_recovery_velocity_margin_xy: 0.20
    mpc_recovery_velocity_margin_z: 0.15
    # 退出恢复前的三维位置误差、水平速度、垂直速度和机体倾角阈值。
    mpc_recovery_exit_position_error: 0.15
    mpc_recovery_exit_speed_xy: 0.15
    mpc_recovery_exit_speed_z: 0.10
    mpc_recovery_exit_tilt_deg: 8.0
    # MPC 无有效输出时改发锁存 yaw 的水平姿态；倾斜推力补偿最多按该倾角计算，避免过推力。
    mpc_recovery_max_thrust_comp_tilt_deg: 30.0
    # 人工或正常降落流程请求 PX4 AUTO.LAND 时的服务重试周期，单位 s。
    auto_land_retry_period: 1.0

# FAST-LIO 高频里程计尖峰门控。单个异常样本不会更新 NMPC 状态；连续异常才进入已有求解失败恢复流程。
odom_spike_guard:
    enabled: true
    # 只比较时间间隔不超过该值的相邻原始样本，避免把通信间断后的首帧误判为尖峰，单位 s。
    max_sample_interval: 0.10
    # 当前坐标相对上一原始样本匀速预测位置的最大残差，单位 m。
    max_position_residual_xy: 0.08
    max_position_residual_z: 0.06
    # 相邻原始样本允许的最大速度突变量，单位 m/s。
    max_velocity_jump_xy: 0.60
    max_velocity_jump_z: 0.60
    # 异常连续达到该时间后锁存故障并进入 MPC_RECOVERY_HOVER，单位 s。
    fault_duration: 0.10
    # 故障后连续收到该数量的正常样本才恢复采用 FAST-LIO 状态。
    recovery_good_samples: 5

thrust_model: # 将 NMPC 物理总推力 T（N）转换为 MAVROS/PX4 归一化推力。
    # 初次模式 1 实机验证时以 1 Hz 打印在线推力比例、悬停比例和 RPM 推力。
    print_value: true
    accurate_thrust_model: 1
    # 0：使用固定比例将推力映射为控制指令，不进行在线标定。
    # 1：使用比例将推力映射为控制指令，并根据电机转速在线标定该比例。
    # 原工程模式 2 依赖负载/电缆动力学；普通四旋翼版本已禁止该模式，配置为 2 时节点拒绝启动。
    # 近似推力映射参数。
    # CAV1 1.817 kg 实机稳定悬停归一化推力；这是 MAVROS/PX4 推力比例，不是牛顿力。
    # 模式 0 固定使用该映射，模式 1 将其作为在线学习初值。
    hover_percentage: 0.54
    # RLS 新估计对推力比例的更新比例；0.2 已通过约 22.7 V 和 24.0 V 实飞验证。
    filter_factor: 0.2
    # 模式 1 学习门限，单位 rpm；只影响在线推力映射，不改变外力估计器的 1000 rpm 门限。
    min_learning_rpm: 7000.0
    # MAVROS/PX4 AttitudeTarget.thrust 最终归一化上限；不是物理推力 N。
    max_normalized_thrust: 0.8
    # 单次 RLS 更新允许的归一化悬停推力比例最大变化量。
    max_hover_percentage_step: 0.01
    noisy_imu: false # 是否使用带噪声的 IMU 模型。

msg_timeout:
    # odom 与 force_attitude_odom 超时仅门控外力估计和在线推力模型，不触发 NMPC/OFFBOARD 退出。
    odom: 0.5
    # force_attitude_odom（UAV1 默认 MAVROS local odom）提供全部控制姿态，单位 s。
    force_attitude_odom: 0.1
    rc:   0.5
    # 当前仅读取并校验，尚未用于命令超时状态切换。
    cmd:  0.5
    imu:  0.5
    # /mavros/battery 实测约 0.5 Hz，允许最长 4 s 未更新，避免 AUTO_TAKEOFF 误判电池超时。
    bat:  4.0
    # /mavros/esc_status 超过该时间未更新时，外力估计无效且 NMPC 补偿立即清零，单位 s。
    rpm:  0.1
    # /mavros/state 实测约 1 Hz；取 1.5 s 避免每个心跳周期内反复触发 STATE_STALE。
    # 超时后只关闭外力补偿，不替代 PX4/MAVROS 自身的链路失效保护。
    state: 1.5
    # /mavros/extended_state 提供 landed_state；超时后禁止外力补偿，单位 s。
    extended_state: 0.5
