# 模型参数
# mass_q 是无人机实际起飞总质量，单位 kg；包含电池、机载电脑、桨和全部飞行安装件。
mass_q: 1.817
# 普通四旋翼版本不再使用吊挂绳长和负载质量；这里仅为兼容旧参数读取保留，不作为调参对象。
l_length: 0.66844507
mass_l: 0.285

# !!! 如果修改以下模型参数，请重新运行 quadrotor_payload_mpc_with_ext_force_codegen，重新生成 MPC 模型代码。 !!!
gravity: 9.795
# step_N/step_T 决定 ACADO 预测时域和采样时间；修改后必须重新运行 codegen 并重新 catkin_make。
step_N: 20
step_T: 0.041
force_estimator: # *
    # 普通四旋翼版本当前不使用原吊挂外力矩模型；保留该项仅为兼容旧参数读取。
    USE_CONSTANT_MOMENT: 1 # 与代码中的模式定义一致。
    # 0：关闭恒定力矩模型。
    # 1：使用 fl 作为恒定力矩。
    # 2：使用 fq 作为恒定力矩。
