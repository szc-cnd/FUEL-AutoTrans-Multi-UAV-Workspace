# Input topics. Defaults match realsense2_camera aligned depth output.
image_topic: /camera/color/image_raw
depth_topic: /camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/color/camera_info
candidate_pose_topic: /UAV0/vision/qr_candidate_pose_camera
candidate_detected_topic: /UAV0/vision/qr_candidate_detected

# Runtime performance.
# 0 means OpenCV default. Use 1-2 on CPU-limited platforms to avoid QR detection
# occupying all cores at high color resolutions.
opencv_num_threads: 2
publish_debug_image: true

# QR candidate and depth settings.
depth_window_size: 11
min_area: 150.0
min_side_length: 16.0
# A QR quadrilateral should not be an extremely elongated background shape.
max_side_ratio: 4.0
max_angle_cos: 0.80
max_quad_area_ratio: 0.35
max_quad_width_ratio: 0.90
max_quad_height_ratio: 0.90
# Lower tolerance reduces finder-pattern matches on nets and floor textures.
qr_eps_x: 0.15
qr_eps_y: 0.15
depth_min: 0.15
depth_max: 8.0

# QR image preprocessing.
# Options: gray, equalize, sharpen, adaptive.
# OpenCV 4.8+ usually detects this target from gray directly. If field images
# get soft, change preprocess_mode to sharpen first before increasing upscale.
preprocess_mode: gray
upscale_factor: 1.5
enable_preprocess_fallbacks: false
decode_qr_data: true
# One successful non-empty decode authenticates the same nearby QR track. The
# following frames still require valid corners and depth, but may finish the
# stable confirmation during brief motion blur without decoding again.
require_decode_for_confirmation: true
decode_verification_hold_seconds: 2.0
decode_verification_max_center_shift_px: 120.0
# D435 自动曝光在首帧后需要短暂稳定时间。预热期间仍可在本机 RViz 观察候选，
# 但不会发布稳定二维码，也不会触发 target_reporting 远程上报。
startup_warmup_seconds: 5.0
# Only draw a box after the detector has been stable for confirm_frames.
draw_raw_candidates: false

# Temporal stability.
confirm_frames: 5
lost_hold_time: 0.3
ema_alpha: 0.35

# Depth consistency for the center and four QR corners. A mixed net/floor or
# background quad is not allowed to become a confirmed 3-D target.
depth_corner_window_size: 7
min_depth_valid_corners: 3
min_depth_valid_ratio: 0.55
max_corner_depth_std: 0.25
max_corner_depth_range: 0.60

# Save failed color frames for later data collection / YOLO fallback training.
save_failed_frame: false
failed_frame_dir: ~/qr_failed_frames
failed_frame_interval: 1.0
