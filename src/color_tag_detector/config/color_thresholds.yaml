# Intel RealSense D435 color-tag detector parameters.
#
# HSV tuning notes:
#   - OpenCV HSV range is H: 0..179, S: 0..255, V: 0..255.
#   - If the mask is noisy, raise S/V lower bounds or increase morph_open_kernel.
#   - If the tag is broken into pieces, lower S/V lower bounds or increase
#     morph_close_kernel.
#   - Red wraps around hue=0, so it uses two ranges.
#   - Human skin can fall near red/orange hue. For red, use a higher S lower
#     bound and exclude low/mid-saturation skin-like pixels.
#   - Dark tiles, shadows, and dark chair backs usually have lower V. For light
#     green/blue tags, keep S lower bounds moderate but require higher V.

color_topic: /camera/color/image_raw
depth_topic: /camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/color/camera_info
candidate_point_topic: /UAV0/color_tag_detector/candidate_point_camera
candidate_text_topic: /UAV0/color_tag_detector/candidate_text

target_color: ""
enabled_colors: []

debug_draw_mode: 1
max_debug_candidates: 3
max_contours_per_color: 8

# H=0..179 连续覆盖；颜色名称只用于显示和记录，正式目标类型始终为 color_tag。
colors:
  red:
    draw_bgr: [0, 0, 255]
    ranges:
      - lower: [0, 130, 60]
        upper: [14, 255, 255]
      - lower: [165, 110, 60]
        upper: [179, 255, 255]
    exclude_ranges:
      - lower: [0, 20, 70]
        upper: [25, 110, 255]
    min_mean_saturation: 135
    min_mean_value: 70
    area_min: 900
    fill_ratio_min: 0.40
    min_valid_depth_ratio: 0.55
    max_depth_std: 0.16
    min_real_width: 0.07
    min_real_height: 0.07

  orange:
    draw_bgr: [0, 128, 255]
    ranges:
      - lower: [15, 90, 70]
        upper: [22, 255, 255]
    min_mean_saturation: 100
    min_mean_value: 75

  yellow:
    draw_bgr: [0, 255, 255]
    ranges:
      - lower: [23, 80, 80]
        upper: [37, 255, 255]
    min_mean_saturation: 90
    min_mean_value: 80

  green:
    draw_bgr: [0, 255, 0]
    ranges:
      # 现场图像中的网格/墙面会落入低饱和绿区；颜色标签应更鲜艳。
      - lower: [38, 55, 90]
        upper: [85, 255, 255]
    max_mean_hue: 85
    min_mean_saturation: 65
    min_mean_value: 100
    area_min: 800
    min_real_width: 0.07
    min_real_height: 0.07
    min_valid_depth_ratio: 0.55
    max_depth_std: 0.16

  blue:
    draw_bgr: [255, 0, 0]
    ranges:
      - lower: [86, 35, 105]
        upper: [127, 255, 255]
    min_mean_hue: 86
    min_mean_saturation: 45
    min_mean_value: 115
    min_valid_depth_ratio: 0.60
    max_depth_std: 0.12
    area_max_ratio: 0.08
    max_real_width: 0.50
    max_real_height: 0.50

  purple:
    # 覆盖紫色、品红色和高饱和粉色；低饱和粉白背景仍由 S/V 门槛排除。
    draw_bgr: [255, 0, 255]
    ranges:
      - lower: [128, 55, 80]
        upper: [164, 255, 255]
    min_mean_saturation: 65
    min_mean_value: 90

area_min: 900
area_max_ratio: 0.10
# 只排除极端细长噪声，不假定比赛标签的具体长宽比。
aspect_ratio_min: 0.15
aspect_ratio_max: 6.0
fill_ratio_min: 0.40

min_extent: 0.40
# 颜色标签应是紧凑目标，排除网格、树叶等凹凸碎片。
min_solidity: 0.65
# 标签形状和尺寸未知，因此不要求矩形；只要求外轮廓内部大部分像素仍属于
# 同一 HSV 色域。可排除衣服褶皱、柜门反光和镂空区域。
min_color_purity: 0.78

max_bbox_width_ratio: 0.80
max_bbox_height_ratio: 0.80

roi_x_min_ratio: 0.10
roi_x_max_ratio: 0.90
roi_y_min_ratio: 0.10
roi_y_max_ratio: 0.90

depth_min: 0.30
depth_max: 5.0
roi_size: 15
min_valid_depth_ratio: 0.55
max_depth_std: 0.16

# 正式上报质量门。超过距离或外观/表面质量不足的色块仍可在本机作为候选
# 观察，但 stable/confirmable 不会置 true，也不会进入远程正式上报。
confirmation_depth_max: 2.5
# 矩形度只参与评分，不作为正式确认硬门槛。
preferred_rectangularity: 0.84
min_surface_depth_valid_ratio: 0.60
max_surface_plane_residual_std: 0.05
surface_depth_max_samples: 2500

# 实际尺寸范围只用于软评分，不会直接淘汰候选。
min_real_width: 0.07
min_real_height: 0.07
max_real_width: 0.55
max_real_height: 0.55

score_threshold: 0.72
switch_score_margin: 0.18
lost_keep_frames: 8

stable_window: 12
stable_min_count: 8
max_pixel_jump: 50
max_depth_jump: 0.25

morph_open_kernel: 3
morph_close_kernel: 7

sync_queue_size: 10
sync_slop: 0.08
