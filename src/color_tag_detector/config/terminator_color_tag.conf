[global_config]
  suppress_multiple_term_dialog = True
[keybindings]
[profiles]
  [[default]]
[layouts]
  [[color_tag_detector]]
    [[[window0]]]
      type = Window
      parent = ""
      title = Color Tag Detector
      size = 1800,900
      maximised = True
    [[[root]]]
      type = HPaned
      parent = window0
      ratio = 0.333
    [[[roscore]]]
      type = Terminal
      parent = root
      profile = default
      title = ROS Master
      command = $HOME/db_ws/src/color_tag_detector/scripts/start_color_tag_detector.sh --roscore
    [[[right]]]
      type = HPaned
      parent = root
      ratio = 0.5
    [[[camera]]]
      type = Terminal
      parent = right
      profile = default
      title = RealSense D435
      command = $HOME/db_ws/src/color_tag_detector/scripts/start_color_tag_detector.sh --camera
    [[[detector]]]
      type = Terminal
      parent = right
      profile = default
      title = Color Tag Detector
      command = $HOME/db_ws/src/color_tag_detector/scripts/start_color_tag_detector.sh --detector
[plugins]
