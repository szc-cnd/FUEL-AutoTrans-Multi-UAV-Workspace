[global_config]
  suppress_multiple_term_dialog = True
  window_state = maximise

[profiles]
  [[default]]

[layouts]
  [[ldop_lidar]]
    [[[window0]]]
      type = Window
      parent = ""
      order = 0
    [[[child1]]]
      type = VPaned
      parent = window0
      order = 0
      ratio = 0.5
    [[[child2]]]
      type = HPaned
      parent = child1
      order = 0
      ratio = 0.5
    [[[child3]]]
      type = HPaned
      parent = child1
      order = 1
      ratio = 0.5
    [[[terminal1]]]
      type = Terminal
      parent = child2
      order = 0
      profile = default
      title = 1 Livox
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" lidar'
    [[[terminal2]]]
      type = Terminal
      parent = child2
      order = 1
      profile = default
      title = 2 MAVROS
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" mavros'
    [[[terminal3]]]
      type = Terminal
      parent = child3
      order = 0
      profile = default
      title = 3 FAST-LIO
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" fastlio'
    [[[terminal4]]]
      type = Terminal
      parent = child3
      order = 1
      profile = default
      title = 4 Fusion
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" fusion'

  [[ldop_all]]
    [[[window0]]]
      type = Window
      parent = ""
      order = 0
    [[[child1]]]
      type = VPaned
      parent = window0
      order = 0
      ratio = 0.3333
    [[[child2]]]
      type = HPaned
      parent = child1
      order = 0
      ratio = 0.5
    [[[child3]]]
      type = VPaned
      parent = child1
      order = 1
      ratio = 0.5
    [[[child4]]]
      type = HPaned
      parent = child3
      order = 0
      ratio = 0.5
    [[[child5]]]
      type = HPaned
      parent = child3
      order = 1
      ratio = 0.5
    [[[terminal1]]]
      type = Terminal
      parent = child2
      order = 0
      profile = default
      title = 1 Livox
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" lidar'
    [[[terminal2]]]
      type = Terminal
      parent = child2
      order = 1
      profile = default
      title = 2 MAVROS
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" mavros'
    [[[terminal3]]]
      type = Terminal
      parent = child4
      order = 0
      profile = default
      title = 3 FAST-LIO
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" fastlio'
    [[[terminal4]]]
      type = Terminal
      parent = child4
      order = 1
      profile = default
      title = 4 Fusion
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" fusion'
    [[[terminal5]]]
      type = Terminal
      parent = child5
      order = 0
      profile = default
      title = 5 LDOP
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" ldop'
    [[[terminal6]]]
      type = Terminal
      parent = child5
      order = 1
      profile = default
      title = 6 Flight Log
      command = '"${LDOP_SCRIPT_DIR}/ros_start_terminator_pane.sh" logger'
